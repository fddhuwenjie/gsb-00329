name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    # 用户端
    - name: Install frontend-user dependencies
      run: |
        cd frontend-user
        npm ci
    
    - name: Lint frontend-user
      run: |
        cd frontend-user
        npm run lint
    
    - name: Build frontend-user
      run: |
        cd frontend-user
        npm run build
    
    # 管理后台
    - name: Install frontend-admin dependencies
      run: |
        cd frontend-admin
        npm ci
    
    - name: Lint frontend-admin
      run: |
        cd frontend-admin
        npm run lint
    
    - name: Build frontend-admin
      run: |
        cd frontend-admin
        npm run build
  
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: lint-and-build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build frontend-user image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend-user
        push: false
        tags: frontend-user:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build frontend-admin image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend-admin
        push: false
        tags: frontend-admin:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Test docker-compose
      run: |
        docker-compose config
        docker-compose up -d
        sleep 10
        docker-compose ps
        docker-compose down
