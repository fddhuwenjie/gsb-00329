version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-3002}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    networks:
      - blog-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
      args:
        - NUXT_PUBLIC_API_BASE=${API_BASE_URL:-http://localhost:3002/api}
    ports:
      - "${FRONTEND_USER_PORT:-8091}:3000"
    environment:
      - NODE_ENV=production
      - NUXT_PUBLIC_API_BASE=${API_BASE_URL:-http://localhost:3002/api}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - blog-network

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE=${API_BASE_URL:-http://localhost:3002/api}
    ports:
      - "${FRONTEND_ADMIN_PORT:-8092}:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_BASE=${API_BASE_URL:-http://localhost:3002/api}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - blog-network

volumes:
  backend-data:

networks:
  blog-network:
    driver: bridge
